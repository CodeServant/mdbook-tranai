[package]
name = "mdbook-tranai"
version = "0.1.0"
edition = "2024"

[dependencies]
mdbook-preprocessor = "0.5.2"
semver = "1.0.27"
clap = "4.5.54"
serde_json = "1.0.149"
serde = { version = "1.0.149", features = ["derive"] }
anyhow = "1.0.100"
url = { version = "2.5.8", features = ["serde"] }
gemini-rust = "1.6.1"
reqwest = { version = "0.13.1", features = ["blocking"] }
tokio = {version = "1.49.0", features = ["full"]}